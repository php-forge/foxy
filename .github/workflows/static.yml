---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: static analysis

permissions:
  contents: read

jobs:
  phpstan:
    uses: php-forge/actions/.github/workflows/phpstan.yml@ed2c7b46bd89123eea257136960b12d27fbb5d9e # v3.0.0
