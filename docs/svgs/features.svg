<svg fill="none" viewBox="0 0 1200 400" width="100%" height="400" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .container {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 20px;
                    padding: 20px;
                }
                .alert-box {
                    border-left: 4px solid #1f883d;
                    padding: 12px;
                    border-radius: 6px;
                    background: rgba(31, 136, 61, 0.1);
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    width: 100%;
                    box-sizing: border-box;
                }
                .alert-title {
                    margin: 0 0 8px 0;
                    font-weight: 600;
                }
                .alert-content {
                    margin: 0;
                    line-height: 1.5;
                }

                /* Light mode */
                    @media (prefers-color-scheme: light) {
                    .alert-title { color: #000000; }
                    .alert-content { color: #333333; }
                    .alert-box { background: rgba(31, 136, 61, 0.1); }
                }

                /* Dark mode */
                @media (prefers-color-scheme: dark) {
                    .alert-title { color: #ffffff; }
                    .alert-content { color: #ffffff; }
                    .alert-box { background: rgba(31, 136, 61, 0.2); }
                }
            </style>
            <div class="container">
                <div class="alert-box">
                    <p class="alert-title"><strong>Dependency aggregation</strong></p>
                    <p class="alert-content">Collects frontend requirements from installed Composer packages</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Native manager support</strong></p>
                    <p class="alert-content">Delegates solving to Bun, npm, pnpm, or Yarn</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Automatic selection</strong></p>
                    <p class="alert-content">Detects one native lockfile, then an available executable</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Flexible project roots</strong></p>
                    <p class="alert-content">Supports <code>package.json</code> outside Composer root via <code>root-package-json-dir</code></p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Protected mock directory</strong></p>
                    <p class="alert-content">Validates paths and ownership before recursive replacement</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Configurable recovery</strong></p>
                    <p class="alert-content">Restores <code>package.json</code> and Composer lock/vendor state after failures</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Defensive I/O</strong></p>
                    <p class="alert-content">Throws an explicit <code>RuntimeException</code> on read, write, or remove failures</p>
                </div>
                <div class="alert-box">
                    <p class="alert-title"><strong>Stable execution</strong></p>
                    <p class="alert-content">Keeps CWD unchanged and preserves semantic, four-space JSON rewrites</p>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
